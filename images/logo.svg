<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56" fill="none">
  <defs>
    <!-- Badge & Outer Frame Gradient -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C89B2D" />
      <stop offset="100%" stop-color="#8F6A00" />
    </linearGradient>

    <!-- Roof & Primary Accent Gradient -->
    <linearGradient id="goldBright" x1="10" y1="10" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF3D1" />
      <stop offset="30%" stop-color="#F8F4E8" />
      <stop offset="100%" stop-color="#DDB244" />
    </linearGradient>

    <!-- Subtle Inner Glow Gradient -->
    <linearGradient id="innerShine" x1="28" y1="4" x2="28" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="softShadow" x="0" y="0" width="56" height="56" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#3A2800" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Square Container Badge -->
  <rect x="4" y="4" width="48" height="48" rx="14" fill="url(#bgGradient)" />
  <rect x="4" y="4" width="48" height="48" rx="14" fill="url(#innerShine)" />

  <!-- Subtle Leaf/Growth Accent Motif (Embedded Background Pattern) -->
  <path d="M28 10 C36 10 42 16 42 24 C34 24 28 18 28 10 Z" fill="#FFFFFF" fill-opacity="0.08" />

  <!-- Main Symbol Group with Soft Shadow -->
  <g filter="url(#softShadow)">
    
    <!-- Stylized Roof / Branch Shield Structure (Digital Protection & Organization) -->
    <path d="M13 25 L28 15 L43 25 L39.5 28.5 L28 20.8 L16.5 28.5 Z" fill="url(#goldBright)" />

    <!-- Three Connected Abstract Human Figures (Unity, Community & Branch) -->
    
    <!-- Central Lead Figure (Slightly Larger) -->
    <circle cx="28" cy="27" r="3.25" fill="#FFFFFF" />
    <path d="M22.5 39 C22.5 34 25 32 28 32 C31 32 33.5 34 33.5 39 Z" fill="#FFFFFF" />

    <!-- Left Member Figure -->
    <circle cx="20" cy="30" r="2.5" fill="#F8F4E8" opacity="0.9" />
    <path d="M15.5 40 C15.5 36 17.5 34.5 20 34.5 C21.8 34.5 23.2 35.3 24 36.8 C23.1 38.2 22.5 39.5 22.2 40 Z" fill="#F8F4E8" opacity="0.9" />

    <!-- Right Member Figure -->
    <circle cx="36" cy="30" r="2.5" fill="#F8F4E8" opacity="0.9" />
    <path d="M32 40 C31.8 39.5 31.2 38.2 30.3 36.8 C31.1 35.3 32.5 34.5 34.3 34.5 C36.8 34.5 38.8 36 38.8 40 Z" fill="#F8F4E8" opacity="0.9" />

    <!-- Connection Arc / Digital Network Base -->
    <path d="M17 42 C21 44 35 44 39 42" stroke="url(#goldBright)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>
</svg>
